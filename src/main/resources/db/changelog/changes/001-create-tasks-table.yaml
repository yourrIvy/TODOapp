databaseChangeLog:
  - changeSet:
      id: 001-create-task-table
      author: nikitaivannikov
      changes:
        - createTable:
            tableName: tasks
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: title
                  type: TEXT
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: completed
                  type: BOOLEAN
              - column:
                  name: created_at
                  type: TIMESTAMP